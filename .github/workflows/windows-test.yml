# Throwaway: build the Windows version on this branch only, to check it before it goes into a release.
name: windows-test
on:
  push:
    branches: [feat/windows]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make zip python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-fluidsynth
            mingw-w64-ucrt-x86_64-zlib
      - name: Build the .zip
        run: scripts/ci/build-windows.sh
      - name: Conformance fixtures
        continue-on-error: true
        run: python tests/run_fixtures.py
      - name: Does the program start? (dummy video and audio; the setup screen just waits)
        run: |
          out/exceeded-*/exceeded.exe --home "$RUNNER_TEMP/h" &
          pid=$!
          sleep 8
          kill -0 $pid && echo "still running after 8 s: ok" && kill $pid
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - uses: actions/upload-artifact@v4
        with:
          name: exceeded-windows
          path: out/*.zip
